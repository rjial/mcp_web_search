[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-web-search"
version = "1.0.0"
description = "Playwright-based Google search and page-distilling MCP server, with an optional agent-browser CLI backend."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.40.0",
    "mcp>=2,<3",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.0.0",
    "trafilatura>=1.0.0",
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.12.0",
    "crawl4ai>=0.8.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "playwright-stealth>=1.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
]

# Note: the optional "agent-browser" backend (get-webpage-markdown
# backend="agent-browser") uses an external Node CLI, not a pip package:
#   npm i -g agent-browser && agent-browser install

[project.scripts]
mcp-web-search = "mcp_integration.server:run"
mcp-web-search-cli = "cli:run"

[tool.hatch.build.targets.wheel]
only-include = ["common", "google_search", "mcp_integration", "cli.py"]
